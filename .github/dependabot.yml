version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '00:30'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
      include:
        - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: '01:30'
      timezone: Europe/Berlin
    # This package is a library: widen constraints to keep older versions
    # installable instead of replacing the supported range.
    versioning-strategy: widen
    cooldown:
      default-days: 7
      semver-patch-days: 3
      include:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
