name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            statamic: '^5.0'
            statamic-major: 5
            testbench: '^10.0'
            dependencies: lowest
          - php: '8.4'
            statamic: '^5.0'
            statamic-major: 5
            testbench: '^10.0'
            dependencies: stable
          - php: '8.2'
            statamic: '^6.0'
            statamic-major: 6
            testbench: '^10.0'
            dependencies: lowest
          - php: '8.5'
            statamic: '^6.0'
            statamic-major: 6
            testbench: '^11.0'
            dependencies: stable

    name: PHP ${{ matrix.php }} - Statamic ${{ matrix.statamic-major }} - ${{ matrix.dependencies }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite, zip
          coverage: none

      - name: Select dependency versions
        run: |
          composer require "statamic/cms:${{ matrix.statamic }}" --no-update --no-interaction
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-${{ matrix.dependencies }} --prefer-dist --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Execute tests
        run: composer test
